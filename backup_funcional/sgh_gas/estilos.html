<style>
    /* ===================================================================
       SISTEMA DE DISEÑO — IDENTIDAD VISUAL INSTITUCIONAL MPPE
       Paleta extraída de https://www.mppe.gob.ve/ (color.css / main.css)
       Regla de Oro 1: Toda la estética vive aquí, aislada del servidor.
       =================================================================== */
    :root {
      /* ── Fondos ── */
      --color-bg:            #f4f6fa;
      --color-bg-2:          #ffffff;
      --color-surface:       #ffffff;
      --color-surface-hover: #f0f2f8;
      --color-border:        #dce1eb;
      --color-border-focus:  rgba(0, 51, 171, 0.45);

      /* ── Paleta institucional MPPE ── */
      --color-primary:       #0033AB;          /* Azul MPPE principal   */
      --color-primary-dark:  #07185a;          /* Azul profundo hover   */
      --color-primary-glow:  rgba(0,51,171,0.18);
      --color-accent:        #F7D117;          /* Amarillo institucional */
      --color-accent-dark:   #d4b000;
      --color-navy:          #213368;          /* Azul marino nav bar   */
      --color-navy-deep:     #1f3177;

      /* ── Semánticos ── */
      --color-success:       #2e7d32;
      --color-danger:        #CF142B;          /* Rojo institucional    */
      --color-warning:       #e6a200;
      --color-info:          #1565c0;

      /* ── Texto ── */
      --text-primary:    #1a1a2e;
      --text-secondary:  #555555;
      --text-muted:      #888888;
      --text-on-primary: #ffffff;

      /* ── Bordes y radio ── */
      --radius-sm:  4px;
      --radius-md:  8px;
      --radius-lg:  14px;
      --radius-xl:  20px;

      /* ── Sombras ── */
      --shadow-card:  0 2px 12px rgba(0, 0, 0, 0.08);
      --shadow-card-hover: 0 6px 24px rgba(0, 0, 0, 0.12);
      --shadow-glow:  0 0 20px var(--color-primary-glow);

      /* ── Transiciones ── */
      --transition-fast:   150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 280ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow:   450ms cubic-bezier(0.4, 0, 0.2, 1);

      /* ── Tipografía ── */
      --font:      'Roboto', Arial, sans-serif;
      --font-mono: 'Courier New', monospace;
    }

    /* ===================================================================
       RESET Y BASE
       =================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.7;
      font-size: 15px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===================================================================
       UTILIDADES
       =================================================================== */
    .oculto { display: none !important; }
    .visualmente-oculto {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
    }

    /* ===================================================================
       VISTA 1: LOGIN
       Fondo animado con orbes de gradiente + tarjeta glassmorphism
       =================================================================== */
    #vista-login {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(145deg, var(--color-navy) 0%, var(--color-primary) 60%, var(--color-navy-deep) 100%);
      z-index: 100;
      transition: opacity var(--transition-slow), transform var(--transition-slow);
    }

    #vista-login.saliendo {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }

    /* Fondo decorativo institucional */
    .login-fondo {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .orbe {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      animation: flotarOrbe 14s ease-in-out infinite alternate;
    }
    .orbe-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #F7D117, transparent 70%);
      top: -140px; left: -120px;
      animation-delay: 0s;
    }
    .orbe-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #0033AB, transparent 70%);
      bottom: -100px; right: -80px;
      animation-delay: -5s;
    }
    .orbe-3 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, #CF142B, transparent 70%);
      top: 45%; left: 60%;
      animation-delay: -9s;
    }
    @keyframes flotarOrbe {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }

    /* Cuadrícula decorativa */
    .login-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    /* Tarjeta de login */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: none;
      border-radius: var(--radius-xl);
      padding: 2.75rem 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: aparecerCard 0.6s var(--transition-slow) both;
    }
    @keyframes aparecerCard {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo / marca */
    .login-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.25rem;
    }

      background-size: cover;
      background-position: center;
      background-color: transparent;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 3px 10px var(--color-primary-glow);
      flex-shrink: 0;
    }
    .login-logo-texto { line-height: 1.2; }
    .login-logo-nombre {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-navy);
      letter-spacing: -0.01em;
    }
    .login-logo-version {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Barra tricolor decorativa bajo el logo */
    .login-logo::after {
      content: '';
      display: block;
      width: 100%;
      height: 3px;
      margin-top: 1.25rem;
      background: linear-gradient(90deg, var(--color-accent) 33%, var(--color-primary) 33%, var(--color-primary) 66%, var(--color-danger) 66%);
      border-radius: 2px;
    }

    /* Encabezado de la tarjeta */
    .login-titulo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-navy);
      margin-bottom: 0.4rem;
    }
    .login-subtitulo {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    /* Grupo de campo de formulario */
    .campo-grupo {
      margin-bottom: 1.25rem;
    }
    .campo-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .campo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .campo-icono {
      position: absolute;
      left: 0.9rem;
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
      transition: color var(--transition-fast);
      z-index: 1;
    }
    .campo-input {
      width: 100%;
      background: #f8f9fc;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 0.9375rem;
      padding: 0.8rem 1rem 0.8rem 2.6rem;
      outline: none;
      transition: border-color var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast);
      appearance: none;
    }
    .campo-input::placeholder { color: var(--text-muted); }
    .campo-input:focus {
      border-color: var(--color-primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px var(--color-primary-glow);
    }
    .campo-input:focus + .campo-icono,
    .campo-wrapper:focus-within .campo-icono { color: var(--color-primary); }

    /* Toggle visibilidad contraseña */
    .btn-toggle-pwd {
      position: absolute;
      right: 0.9rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem;
      transition: color var(--transition-fast);
      line-height: 1;
    }
    .btn-toggle-pwd:hover { color: var(--color-accent); }

    /* Botón primario */
    .btn-primario {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      background: var(--color-primary);
      color: var(--text-on-primary);
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font);
      font-size: 0.9375rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
      box-shadow: 0 3px 12px var(--color-primary-glow);
      position: relative;
      overflow: hidden;
    }
    .btn-primario::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity var(--transition-fast);
    }
    .btn-primario:hover::after { opacity: 1; }
    .btn-primario:hover {
      background: var(--color-primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--color-primary-glow);
    }
    .btn-primario:active { transform: translateY(0); }
    .btn-primario:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner inline */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(0,51,171,0.2);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: girar 0.7s linear infinite;
      flex-shrink: 0;
    }
    .btn-primario .spinner,
    .btn-enviar .spinner {
      border-color: rgba(255,255,255,0.3);
      border-top-color: #fff;
    }
    @keyframes girar {
      to { transform: rotate(360deg); }
    }

    /* Mensaje de estado login */
    #login-mensaje {
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      transition: all var(--transition-normal);
    }
    #login-mensaje.error   { background: #fef2f2; color: var(--color-danger); border: 1px solid #fecaca; }
    #login-mensaje.exito   { background: #f0fdf4; color: var(--color-success); border: 1px solid #bbf7d0; }
    #login-mensaje.cargando { background: #eff6ff; color: var(--color-primary); border: 1px solid #bfdbfe; }

    /* ===================================================================
       VISTA 2: PRINCIPAL (FORMULARIO DE CAPTURA)
       Header + contenido con form en secciones
       =================================================================== */
    #vista-principal {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity var(--transition-slow), transform var(--transition-slow);
    }
    #vista-principal.entrando {
      opacity: 1;
      transform: translateY(0);
    }

    /* Header de la app */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--color-navy);
      border-bottom: 3px solid var(--color-accent);
      padding: 0.875rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      overflow: hidden;       /* necesario para contener la bandera animada */
    }

    /* Bandera de Venezuela ondeante semitransparente */
    .app-header::before {
      content: '';
      position: absolute;
      inset: -15% -8%;          /* más grande que el header para cubrir al ondear */
      background: linear-gradient(
        to bottom,
        #FFD100 33.33%,         /* Amarillo */
        #003087 33.33% 66.66%, /* Azul     */
        #CF142B 66.66%          /* Rojo     */
      );
      opacity: 0.18;            /* semitransparente */
      animation: venezuelaWave 5s ease-in-out infinite;
      transform-origin: center center;
      z-index: 0;
      pointer-events: none;
    }

    /* 8 estrellas blancas de Venezuela en arco sobre la franja azul */
    .app-header::after {
      content: '';

      inset: 0;

    /* El contenido del header queda sobre la bandera */
    .app-header > * {
      position: relative;
      z-index: 1;
    }

    @keyframes venezuelaWave {

      15%  { transform: skewX(-4deg) skewY( 1.2deg) scaleX(1.03); }
      30%  { transform: skewX( 3deg) skewY(-0.8deg) scaleX(0.98); }
      50%  { transform: skewX(-2deg) skewY( 1.5deg) scaleX(1.02); }
      65%  { transform: skewX( 4deg) skewY(-1.0deg) scaleX(1.03); }
      80%  { transform: skewX(-3deg) skewY( 0.5deg) scaleX(0.99); }
      100% { transform: skewX( 0deg) skewY( 0.0deg) scaleX(1.00); }

      background-size: cover;
      background-position: center;
      background-color: transparent;

      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .header-marca-nombre {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-on-primary);
    }
    .header-marca-plantel {
      font-size: 0.78rem;
      color: var(--color-accent);
      font-weight: 500;
    }

    /* Perfil de usuario en header */
    .header-perfil {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .perfil-info { text-align: right; }
    .perfil-nombre {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-on-primary);
    }
    .perfil-rol {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.65);
    }
    .perfil-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 900;
      color: var(--color-navy);
      flex-shrink: 0;
    }
    .btn-cerrar-sesion {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.9rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
      color: rgba(255,255,255,0.75);
      font-family: var(--font);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-cerrar-sesion:hover {
      border-color: var(--color-danger);
      color: #fff;
      background: var(--color-danger);
    }

    /* Contenido principal */
    .app-contenido {
      flex: 1;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    /* Encabezado del formulario */
    .form-encabezado {
      margin-bottom: 2rem;
    }
    .form-titulo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--color-navy);
      margin-bottom: 0.35rem;
    }
    .form-subtitulo {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* Banner de carga de catálogos */
    #banner-catalogos {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: var(--color-primary);
      margin-bottom: 1.75rem;
      font-weight: 500;
      transition: all var(--transition-normal);
    }
    #banner-catalogos.listo {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: var(--color-success);
    }
    #banner-catalogos.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: var(--color-danger);
    }

    /* Sección del formulario con tarjeta */
    .form-seccion {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 1.5rem;
      transition: box-shadow var(--transition-normal);
    }
    .form-seccion:hover {
      box-shadow: var(--shadow-card-hover);
    }
    .seccion-encabezado {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 1.1rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
      background: #f8f9fc;
    }
    .seccion-icono {
      width: 30px; height: 30px;
      border-radius: var(--radius-sm);
      background: var(--color-primary-glow);
      border: 1px solid rgba(0,51,171,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .seccion-titulo {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--color-navy);
      letter-spacing: -0.01em;
    }
    .seccion-subtitulo {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .seccion-cuerpo {
      padding: 1.5rem;
    }

    /* Grid de campos del formulario */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.1rem;
    }
    .form-grid-completo {
      grid-column: 1 / -1;
    }

    /* Campo de formulario (principal) */
    .form-campo { display: flex; flex-direction: column; gap: 0.45rem; }
    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .form-label .requerido { color: var(--color-danger); margin-left: 2px; }

    .form-input, .form-select, .form-textarea {
      background: #f8f9fc;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 0.9rem;
      padding: 0.7rem 0.9rem;
      outline: none;
      width: 100%;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
      appearance: none;
    }
    .form-input::placeholder,
    .form-textarea::placeholder { color: var(--text-muted); }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--color-primary);
      background: #fff;
      box-shadow: 0 0 0 3px var(--color-primary-glow);
    }

    /* Select con flecha personalizada */
    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-primary);
      pointer-events: none;
      font-size: 0.85rem;
    }
    .form-select { padding-right: 2.5rem; cursor: pointer; }
    .form-select option {
      background: #ffffff;
      color: var(--text-primary);
    }
    .form-select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Skeleton loader para selects mientras cargan catálogos */
    .select-skeleton {
      height: 42px;
      background: linear-gradient(90deg,
        #eef1f6 25%,
        #dde3ed 50%,
        #eef1f6 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* Mensaje de error de campo */
    .campo-error {
      font-size: 0.75rem;
      color: var(--color-danger);
      font-weight: 500;
      display: none;
    }
    .form-campo.invalido .form-input,
    .form-campo.invalido .form-select {
      border-color: var(--color-danger);
    }
    .form-campo.invalido .campo-error { display: block; }

    /* Barra de acciones del formulario */
    .form-acciones {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      padding: 1.5rem 0;
      border-top: 1px solid var(--color-border);
      margin-top: 0.5rem;
    }

    .btn-secundario {
      padding: 0.7rem 1.4rem;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--text-on-primary);
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .btn-secundario:hover {
      border-color: var(--text-secondary);
      color: var(--text-primary);
      background: var(--color-surface);
    }

    .btn-enviar {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.6rem;
      background: var(--color-primary);
      border: none;
